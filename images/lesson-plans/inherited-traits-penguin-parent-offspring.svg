<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="t d"><title id="t">Penguin parent and offspring</title><desc id="d">Adult penguin and fluffy penguin chick share upright body shapes and pointed orange beaks but have different feather colors.</desc><rect width="360" height="180" fill="#eaf8ff"/><g stroke="#202a33" stroke-width="3"><ellipse cx="105" cy="94" rx="48" ry="68" fill="#27343d"/><ellipse cx="258" cy="108" rx="40" ry="54" fill="#777"/></g><ellipse cx="105" cy="103" rx="29" ry="46" fill="#fff"/><ellipse cx="258" cy="116" rx="25" ry="34" fill="#d6d6d6"/><g fill="#f4a62a"><path d="M103 67l38 10-38 11z"/><path d="M257 85l31 9-31 10z"/></g><text x="105" y="173" text-anchor="middle" font-family="Arial" font-weight="700">PARENT</text><text x="258" y="173" text-anchor="middle" font-family="Arial" font-weight="700">OFFSPRING</text></svg>