<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="t d"><title id="t">Sunflower parent and offspring</title><desc id="d">Tall parent sunflower and shorter offspring sunflower share yellow petals and brown centers.</desc><rect width="360" height="180" fill="#fffbea"/><path d="M90 155V65M270 155V90" stroke="#3b8d42" stroke-width="8"/><path d="M90 112L50 92M270 126L310 108" stroke="#3b8d42" stroke-width="7"/><g fill="#ffd54f" stroke="#d79d00" stroke-width="3"><circle cx="90" cy="52" r="34"/><circle cx="270" cy="78" r="27"/></g><g fill="#6d4c41"><circle cx="90" cy="52" r="14"/><circle cx="270" cy="78" r="11"/></g><text x="90" y="173" text-anchor="middle" font-family="Arial" font-weight="700">PARENT</text><text x="270" y="173" text-anchor="middle" font-family="Arial" font-weight="700">OFFSPRING</text></svg>